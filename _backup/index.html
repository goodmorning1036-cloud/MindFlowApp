<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: {
                            DEFAULT: '#0B0E14',
                            light: '#1A1F29',
                        },
                        neon: {
                            cyan: '#00E5FF',
                        },
                        electric: {
                            blue: '#5C7CFA',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- App Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-white antialiased flex flex-col items-center justify-center min-h-screen relative selection:bg-neon-cyan selection:text-midnight">

    <!-- Background Texture -->
    <div class="bg-texture"></div>

    <!-- MAIN CONTAINER -->
    <main id="app-container" class="w-full max-w-md px-6 flex flex-col items-center relative z-10">

        <!-- HEADER: Timer (Visible during race) -->
        <div id="timer-container" class="opacity-0 transition-opacity duration-700 mb-12 text-center transform translate-y-[-20px]">
            <h1 id="timer-display" class="text-6xl font-extralight tracking-tighter tabular-nums drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                00:00.<span class="text-3xl text-gray-400">00</span>
            </h1>
        </div>

        <!-- CENTER: Input (Home State) -->
        <div id="home-view" class="w-full flex flex-col items-center transition-all duration-700 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <input type="text" 
                   id="focus-input" 
                   class="glass-input w-full text-center text-2xl font-light py-2 placeholder-gray-600 focus:placeholder-gray-500 bg-transparent"
                   placeholder="What are you focusing on?" 
                   autocomplete="off">
        </div>

        <!-- CENTER: Race Track (Race State) -->
        <div id="race-view" class="w-full opacity-0 pointer-events-none transition-all duration-700 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            
            <!-- YOU BAR -->
            <div class="mb-6 relative">
                <div class="flex justify-between text-xs font-medium tracking-widest text-neon-cyan mb-2 uppercase opacity-80">
                    <span>You</span>
                    <span id="lead-indicator" class="opacity-0 transition-opacity text-green-400">+0.0s</span>
                </div>
                <!-- Track BG -->
                <div class="w-full h-3 bg-white/5 rounded-full overflow-hidden relative glass-panel">
                    <!-- Progress Fill -->
                    <div id="you-bar" class="h-full bg-gradient-to-r from-electric-blue to-neon-cyan rounded-full w-0 relative shadow-[0_0_15px_rgba(0,229,255,0.5)]">
                        <!-- Glowing Tip -->
                        <div class="absolute right-0 top-0 bottom-0 w-1 bg-white shadow-[0_0_10px_white]"></div>
                    </div>
                </div>
            </div>

            <!-- GHOST BAR -->
            <div id="ghost-container" class="opacity-50 relative">
                <div class="flex justify-between text-xs font-medium tracking-widest text-gray-400 mb-2 uppercase">
                    <span>Ghost</span>
                    <span id="ghost-time-label">--:--</span>
                </div>
                <!-- Track BG -->
                <div class="w-full h-2 bg-white/5 rounded-full overflow-hidden relative">
                    <!-- Ghost Fill -->
                    <div id="ghost-bar" class="h-full bg-white/20 rounded-full w-0 transition-all duration-100 ease-linear"></div>
                </div>
            </div>

        </div>

        <!-- FOOTER: Action Button -->
        <div id="action-container" class="mt-48 transition-all duration-500">
            <button id="start-btn" 
                    class="group relative flex items-center justify-center w-16 h-16 rounded-full border border-neon-cyan/50 text-neon-cyan hover:bg-neon-cyan/10 transition-all duration-300 animate-pulse-ring">
                <span class="text-sm font-semibold tracking-wide group-hover:scale-105 transition-transform">GO</span>
            </button>

            <button id="complete-btn" 
                    class="hidden w-48 h-12 rounded-full bg-electric-blue text-white font-semibold shadow-[0_0_20px_rgba(92,124,250,0.4)] hover:shadow-[0_0_30px_rgba(92,124,250,0.6)] hover:scale-105 transition-all duration-300 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Complete
            </button>
        </div>

    </main>

    <!-- MODAL: Achievement -->
    <div id="achievement-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="glass-panel p-8 rounded-2xl max-w-xs w-full text-center transform scale-95 transition-transform duration-500" id="modal-content">
            <div class="mb-4 flex justify-center">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-neon-cyan to-electric-blue flex items-center justify-center shadow-lg animate-float">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
            </div>
            
            <h2 id="modal-title" class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400 mb-1">
                New Record!
            </h2>
            <p id="modal-subtitle" class="text-sm text-gray-400 mb-6">You beat your ghost.</p>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white/5 rounded-lg p-3">
                    <p class="text-[10px] uppercase tracking-wider text-gray-500">Your Time</p>
                    <p id="modal-time" class="text-xl font-mono text-white">12:45</p>
                </div>
                <div class="bg-white/5 rounded-lg p-3">
                    <p class="text-[10px] uppercase tracking-wider text-gray-500">Saved</p>
                    <p id="modal-diff" class="text-xl font-mono text-neon-cyan">-15s</p>
                </div>
            </div>

            <button id="close-modal-btn" class="w-full py-3 rounded-xl border border-white/10 hover:bg-white/5 text-sm transition-colors">
                Continue
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
